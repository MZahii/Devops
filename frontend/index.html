<!DOCTYPE html>
<html>
<head>
    <title>DevOps Project</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #d32f2f; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; color: green; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎓 Student Management UI</h1>
        <p>Frontend deployed on Kubernetes</p>
        <button onclick="fetchData()">Test Backend Connection</button>
        <div id="result">Waiting for click...</div>
    </div>

    <script>
        function fetchData() {
            document.getElementById('result').innerText = "Connecting to Backend...";
            // We point to the backend relative path (we will use Ingress later or NodePort)
            // For now, let's just simulate the "Alive" check
            setTimeout(() => {
                document.getElementById('result').innerText = "✅ Backend is Reachable! (Simulation)";
            }, 1000);
        }
    </script>
</body>
</html>
