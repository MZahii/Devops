<div class="container">
  <div class="row">
    
    <!-- LEFT COLUMN: ADD FORM -->
    <div class="col-md-4">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0">➕ Add Student</h5>
        </div>
        <div class="card-body">
          <form (ngSubmit)="addStudent()">
            <div class="mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" [(ngModel)]="newStudent.firstName" name="firstName" placeholder="Ex: John">
            </div>
            <div class="mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" [(ngModel)]="newStudent.lastName" name="lastName" placeholder="Ex: Doe">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="newStudent.email" name="email" placeholder="Ex: john.doe@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Department</label>
              <select class="form-select" [(ngModel)]="selectedDepartmentId" name="department">
                <option [value]="undefined">Select a Department</option>
                <option *ngFor="let dept of departments" [value]="dept.idDepartment">
                  {{ dept.name }} - {{ dept.location }}
                </option>
              </select>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success">Save Student</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <h6>Total Students</h6>
          <h2 class="text-success">{{ students.length }}</h2>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: DATA LIST -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">👥 Student List</h5>
          <button class="btn btn-sm btn-light" (click)="loadStudents()">🔄 Refresh</button>
        </div>
        <div class="card-body p-0">
          
          <div *ngIf="loading" class="text-center p-4">
            <div class="spinner-border text-success" role="status"></div>
            <p>Loading data...</p>
          </div>

          <table class="table table-striped table-hover mb-0" *ngIf="!loading">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let student of students">
                <td>#{{ student.idStudent }}</td>
                <td class="fw-bold">{{ getStudentName(student) }}</td>
                <td>{{ student.email }}</td>
                <td><span class="badge bg-info text-dark">{{ student.department?.name }}</span></td>
                <td class="text-end">
                  <button class="btn btn-sm btn-danger" (click)="deleteStudent(student.idStudent)">
                    🗑 Delete
                  </button>
                </td>
              </tr>
              <tr *ngIf="students.length === 0">
                <td colspan="5" class="text-center p-3 text-muted">No students found. Add one!</td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>
    </div>

  </div>
</div>
