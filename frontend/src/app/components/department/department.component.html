<div class="container fade-in">
  <div class="row g-4">

    <!-- LEFT COLUMN: ADD FORM -->
    <div class="col-lg-4 col-md-12">
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">
            <i class="bi bi-plus-circle-fill me-2"></i>
            Add New Department
          </h5>
        </div>
        <div class="card-body">
          <form (ngSubmit)="addDepartment()">
            <div class="mb-4">
              <label class="form-label">
                <i class="bi bi-building"></i>
                Department Name
              </label>
              <input type="text" class="form-control" [(ngModel)]="newDept.name" name="name"
                placeholder="e.g., Computer Science" required>
            </div>
            <div class="mb-4">
              <label class="form-label">
                <i class="bi bi-geo-alt-fill"></i>
                Location
              </label>
              <input type="text" class="form-control" [(ngModel)]="newDept.location" name="location"
                placeholder="e.g., Building A, Floor 3" required>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success" [disabled]="!isFormValid">
                <i class="bi bi-check-circle-fill"></i>
                Save Department
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Quick Stats Card -->
      <div class="card shadow-sm text-center glass-effect">
        <div class="card-body py-4">
          <i class="bi bi-folder-fill text-primary" style="font-size: 3rem;"></i>
          <h6 class="text-uppercase text-muted mt-3 mb-2">Total Departments</h6>
          <h1 class="text-primary mb-0" style="font-size: 3.5rem; font-weight: 800;">
            {{ departments.length }}
          </h1>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: DATA LIST -->
    <div class="col-lg-8 col-md-12">
      <div class="card shadow-sm">
        <div
          class="card-header bg-secondary text-white d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h5 class="mb-0">
            <i class="bi bi-list-ul me-2"></i>
            Department Directory
          </h5>
          <button class="btn btn-sm btn-light" (click)="loadDepartments()">
            <i class="bi bi-arrow-clockwise"></i>
            Refresh
          </button>
        </div>
        <div class="card-body p-0">

          <!-- Loading State -->
          <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-primary mb-4" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted">
              <i class="bi bi-hourglass-split me-2"></i>
              Loading department data...
            </p>
          </div>

          <!-- Data Table -->
          <div *ngIf="!loading" class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-dark">
                <tr>
                  <th><i class="bi bi-hash me-1"></i>ID</th>
                  <th><i class="bi bi-building me-1"></i>Department Name</th>
                  <th><i class="bi bi-geo-alt me-1"></i>Location</th>
                  <th class="text-end"><i class="bi bi-gear-fill me-1"></i>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let dept of departments; trackBy: trackByDepartmentId" class="fade-in">
                  <td>
                    <span class="badge bg-secondary">
                      <i class="bi bi-tag-fill me-1"></i>
                      {{ dept.idDepartment }}
                    </span>
                  </td>
                  <td class="fw-bold">
                    <i class="bi bi-briefcase-fill text-primary me-2"></i>
                    {{ dept.name }}
                  </td>
                  <td>
                    <span class="badge bg-info">
                      <i class="bi bi-pin-map-fill me-1"></i>
                      {{ dept.location }}
                    </span>
                  </td>
                  <td class="text-end">
                    <button class="btn btn-sm btn-danger" (click)="delete(dept.idDepartment)" title="Delete department">
                      <i class="bi bi-trash-fill"></i>
                      Delete
                    </button>
                  </td>
                </tr>

                <!-- Empty State -->
                <tr *ngIf="departments.length === 0">
                  <td colspan="4" class="text-center py-5">
                    <div class="text-muted">
                      <i class="bi bi-inbox" style="font-size: 4rem; opacity: 0.3;"></i>
                      <h5 class="mt-3">No Departments Found</h5>
                      <p class="mb-0">Why not add your first department using the form?</p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
