spring.application.name=student-management

# Database configuration (use environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA configuration
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool Configuration (for better performance under load)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=StudentManagementHikariCP

# Server configuration
server.port=${SERVER_PORT:8089}
server.servlet.context-path=/student

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:30088,http://192.168.56.20:30088,http://192.168.56.20:8888}

# Actuator endpoints for Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=StudentManagement

# Logging configuration
logging.level.tn.esprit.studentmanagement=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${SPRING_JPA_SHOW_SQL:false}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n